<div class="workspace">

  <header class="header">

    <div class="header__identity">

      <div class="header__brand">
        WR
      </div>

      <div class="header__titles">
        <strong class="header__title">
          Workspace WR
        </strong>

        <span class="header__subtitle">
          Datapar
        </span>
      </div>

    </div>

    <div class="header__tabs">
      <app-tabs />
    </div>

    <div class="header__actions">

      <button type="button" class="header-action header-action--search" title="Buscar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6" />
          <path d="m16 16 4 4" />
        </svg>

        <span>Buscar</span>
      </button>

      <button type="button" class="header-action" title="Ajuda">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M9.8 9a2.4 2.4 0 1 1 3.6 2.1c-.9.5-1.4 1-1.4 2" />
          <path d="M12 17h.01" />
        </svg>
      </button>

      <button type="button" class="header-action" title="Notificações">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7" />
          <path d="M10 19h4" />
        </svg>
      </button>

      <div class="header-user">

        <div class="header-user__avatar">
          B
        </div>

        <div class="header-user__info">
          <strong>Bruno</strong>
          <span>Datapar</span>
        </div>

      </div>

    </div>

  </header>

  <div class="workspace-body">

    <app-application-rail [applications]="applications()" [activeApplicationId]="activeApplicationId"
      (applicationSelected)="selectApplication($event)" />

    <app-application-menu [application]="activeApplication" />

    <main class="main">
      <app-iframe-host />
    </main>

  </div>

</div>
