<div class="workspace">
  <header class="header">
    <button type="button" class="header__company" disabled
      title="Troca de empresa/filial (em desenvolvimento)">
      <span class="header__company-identity">
        <span class="header__logo" aria-hidden="true">WR</span>
        <span class="header__company-names">
          <strong class="header__company-name">Workspace WR</strong>
          <span class="header__company-branch">Datapar</span>
        </span>
      </span>
      <app-icon class="header__company-caret" name="caret-up-down" [size]="20" />
    </button>

    <div class="header__container">
      <app-application-rail
        [applications]="applications()"
        [activeApplicationId]="activeApplicationId()"
        [homeActive]="homeActive()"
        (applicationSelected)="selectApplication($event)"
        (homeSelected)="showHome()" />

      <div class="header__user-area">
        <button type="button" class="header__apps" title="Aplicações (em desenvolvimento)"
          aria-label="Aplicações (em desenvolvimento)" disabled>
          <app-icon name="squares-four" [size]="20" />
        </button>

        <button type="button" class="header__user" disabled title="Perfil (em desenvolvimento)">
          <span class="header__avatar" aria-hidden="true">B</span>
          <span class="header__user-info">
            <strong class="header__user-name">Bruno</strong>
            <span class="header__user-role">Usuário</span>
          </span>
          <app-icon class="header__user-caret" name="caret-down" [size]="16" />
        </button>
      </div>
    </div>

    <label class="header__search">
      <input type="search" aria-label="Busca global (em desenvolvimento)"
        placeholder="Telas, sistemas e comandos..." disabled />
      <app-icon name="magnifying-glass" [size]="20" />
    </label>
  </header>

  @if (homeActive()) {
    <app-home (telaSolicitada)="openFromHome($event)" />
  }

  <!--
    Escondido (e não removido) enquanto a Home está aberta: assim os iframes
    das abas continuam vivos e não perdem o estado.
  -->
  <div class="workspace-body" [class.workspace-body--menu-collapsed]="menuCollapsed()"
    [class.workspace-body--no-menu]="!showSideMenu()"
    [hidden]="homeActive()">
    <!-- Aplicações sem menu (ex.: Rodopar) não têm menu lateral. -->
    @if (showSideMenu()) {
      @if (menuCollapsed()) {
        <aside class="menu-collapsed" aria-label="Menu recolhido">
        <button type="button" class="menu-expand" (click)="toggleMenu()" title="Exibir menu" aria-label="Exibir menu">
          <app-icon name="caret-double-right" [size]="16" />
        </button>
      </aside>
      }
      @if (!menuCollapsed()) {
        <app-application-menu [application]="activeApplication()" (collapseRequested)="toggleMenu()" />
      }
    }
    <main class="main">
      <div class="main__tabs"><app-tabs /></div>
      <app-iframe-host />
    </main>
  </div>
</div>
