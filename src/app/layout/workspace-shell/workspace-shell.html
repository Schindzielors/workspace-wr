<div class="workspace">
  <header class="header">
    <div class="header__identity">
      <div class="header__brand" aria-hidden="true">WR</div>
      <div class="header__titles">
        <strong class="header__title">Workspace WR</strong>
        <span class="header__subtitle">Datapar</span>
      </div>
      <span class="header__chevrons" aria-hidden="true">⌃<span>⌄</span></span>
    </div>

    <app-application-rail
      [applications]="applications()"
      [activeApplicationId]="activeApplicationId"
      (applicationSelected)="selectApplication($event)" />

    <div class="header__search">
      <input type="search" aria-label="Busca global (em desenvolvimento)"
        placeholder="Telas, sistemas e comandos..." disabled />
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6" />
        <path d="m16 16 4 4" />
      </svg>
    </div>

    <div class="header__actions">
      <button type="button" class="header__apps" title="Aplicações (em desenvolvimento)" aria-label="Aplicações (em desenvolvimento)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="6" height="6" rx="1" />
          <rect x="14" y="4" width="6" height="6" rx="1" />
          <rect x="4" y="14" width="6" height="6" rx="1" />
          <rect x="14" y="14" width="6" height="6" rx="1" />
        </svg>
      </button>
      <div class="header__user">
        <div class="header__avatar" aria-hidden="true">B</div>
        <div class="header__user-info">
          <strong>Bruno</strong>
          <span>Usuário</span>
        </div>
        <span class="header__user-chevron" aria-hidden="true">⌄</span>
      </div>
    </div>
  </header>

  <div class="workspace-body" [class.workspace-body--menu-collapsed]="menuCollapsed()">
    @if (menuCollapsed()) {
      <button type="button" class="menu-expand" (click)="toggleMenu()" title="Exibir menu" aria-label="Exibir menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 7 7-7 7" /><path d="m14 5 7 7-7 7" /></svg>
      </button>
    }
    @if (!menuCollapsed()) {
      <app-application-menu [application]="activeApplication" (collapseRequested)="toggleMenu()" />
    }
    <main class="main">
      <div class="main__tabs"><app-tabs /></div>
      <app-iframe-host />
    </main>
  </div>
</div>
