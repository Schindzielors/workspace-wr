<div class="workspace">
  <header class="header">
    <!-- Visão atual (grupo/empresa/filial); abre o "Trocar visão". -->
    <button #visaoTrigger type="button" class="header__company" aria-haspopup="dialog"
      [attr.aria-expanded]="visaoOpen()" title="Trocar visão" (click)="openVisao()">
      <span class="header__company-identity">
        <span class="header__logo" aria-hidden="true">WR</span>
        <span class="header__company-names">
          <strong class="header__company-name">{{ visaoService.rotulo()?.titulo ?? 'Workspace WR' }}</strong>
          <span class="header__company-branch">{{ visaoService.rotulo()?.subtitulo ?? 'Datapar' }}</span>
        </span>
      </span>
      <app-icon class="header__company-caret" name="caret-up-down" [size]="20" />
    </button>

    <div class="header__container">
      <app-application-rail
        [applications]="applications()"
        [activeApplicationId]="activeApplicationId()"
        [homeActive]="homeActive()"
        (applicationSelected)="selectApplication($event)"
        (homeSelected)="showHome()" />

      <div class="header__user-area">
        <button type="button" class="header__apps" title="Aplicações (em desenvolvimento)"
          aria-label="Aplicações (em desenvolvimento)" disabled>
          <app-icon name="squares-four" [size]="20" />
        </button>

        <!-- Menu do usuário: Configurações, Notificações, Ajuda, Sair. -->
        <button #userTrigger type="button" class="header__user" aria-haspopup="menu"
          [attr.aria-expanded]="userPanel() === 'menu'" title="Menu do usuário"
          (click)="toggleUserMenu()">
          <app-avatar class="header__avatar" [iniciais]="usuarioService.iniciais()"
            [fotoUrl]="usuarioService.perfil()?.fotoUrl" [size]="40" />
          <span class="header__user-info">
            <strong class="header__user-name">{{ usuarioService.primeiroNome() || 'Usuário' }}</strong>
            <span class="header__user-role">{{ usuarioService.perfil()?.cargo ?? '' }}</span>
          </span>
          <app-icon class="header__user-caret" name="caret-down" [size]="16" />
        </button>
      </div>
    </div>

    <!-- Abre a busca global (também com Ctrl+K / ⌘K). -->
    <button #searchTrigger type="button" class="header__search" aria-haspopup="dialog"
      [attr.aria-expanded]="paletteOpen()" aria-keyshortcuts="Control+K Meta+K"
      title="Buscar (Ctrl+K)" (click)="openPalette()">
      <span class="header__search-placeholder">Telas, sistemas e comandos...</span>
      <app-icon name="magnifying-glass" [size]="20" />
    </button>
  </header>

  @if (homeActive()) {
    <app-home (telaSolicitada)="openFromHome($event)" />
  }

  <!--
    Escondido (e não removido) enquanto a Home está aberta: assim os iframes
    das abas continuam vivos e não perdem o estado.
  -->
  <div class="workspace-body" [class.workspace-body--menu-collapsed]="menuCollapsed()"
    [class.workspace-body--no-menu]="!showSideMenu()"
    [hidden]="homeActive()">
    <!-- Aplicações sem menu (ex.: Rodopar) não têm menu lateral. -->
    @if (showSideMenu()) {
      @if (menuCollapsed()) {
        <aside class="menu-collapsed" aria-label="Menu recolhido">
        <button type="button" class="menu-expand" (click)="toggleMenu()" title="Exibir menu" aria-label="Exibir menu">
          <app-icon name="caret-double-right" [size]="16" />
        </button>
      </aside>
      }
      @if (!menuCollapsed()) {
        <app-application-menu [application]="activeApplication()" (collapseRequested)="toggleMenu()" />
      }
    }
    <main class="main">
      <div class="main__tabs"><app-tabs /></div>
      <app-iframe-host />
    </main>
  </div>
</div>

@if (paletteOpen()) {
  <app-command-palette [applications]="applications()"
    (escolhido)="runPaletteAction($event)" (fechar)="closePalette()" />
}

@if (visaoOpen()) {
  <app-visao-picker (fechar)="closeVisao()" />
}

@switch (userPanel()) {
  @case ('menu') {
    <app-user-menu (escolhido)="openUserPanel($event)" (fechar)="closeUserPanel()" />
  }
  @case ('configuracoes') {
    <app-user-settings (fechar)="closeUserPanel()" />
  }
  @case ('notificacoes') {
    <app-user-notifications (fechar)="closeUserPanel()" />
  }
}
