<div class="backdrop" (click)="fechar.emit()" aria-hidden="true"></div>

<section class="picker" role="dialog" aria-modal="true" aria-labelledby="visao-titulo"
  aria-describedby="visao-descricao">
  <header class="picker__header">
    <div>
      <h2 class="picker__title" id="visao-titulo">Trocar visão</h2>
      <p class="picker__subtitle" id="visao-descricao">Baseado no seu nível de acesso</p>
    </div>
    <button type="button" class="picker__close" aria-label="Fechar" title="Fechar" (click)="fechar.emit()">
      <app-icon name="x" [size]="16" />
    </button>
  </header>

  <div class="picker__body">
    <app-visao-form [focarBusca]="true" [(idGrupo)]="idGrupo" [(idEmpresa)]="idEmpresa"
      [(idFilial)]="idFilial" />
  </div>

  <footer class="picker__footer">
    @if (erro()) {
      <p class="picker__error" role="alert">Não foi possível trocar a visão. Tente novamente.</p>
    }
    <button type="button" class="picker__submit" [disabled]="!idGrupo() || salvando()" (click)="selecionar()">
      {{ salvando() ? 'Selecionando...' : 'Selecionar' }}
    </button>
  </footer>
</section>
