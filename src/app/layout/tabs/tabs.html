<div class="tabs" role="tablist" aria-label="Abas abertas">
  @for (tab of tabsService.tabs(); track tab.id) {
    <div class="tab" [class.tab--active]="tabsService.activeTabId() === tab.id">
      <button type="button" class="tab__select" role="tab"
        [attr.aria-selected]="tabsService.activeTabId() === tab.id"
        [attr.title]="tab.title" (click)="activate(tab.id)">
        <span class="tab__title">{{ tab.title }}</span>
      </button>
      <button type="button" class="tab__action tab__reload"
        [class.tab__reload--loading]="tabsService.isLoading(tab.id)"
        [attr.aria-label]="'Atualizar ' + tab.title" title="Atualizar"
        (click)="reload($event, tab.id)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 5.7" />
          <path d="M20 4v7h-7" />
        </svg>
      </button>
      <button type="button" class="tab__action tab__close"
        [attr.aria-label]="'Fechar ' + tab.title" title="Fechar"
        (click)="close($event, tab.id)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12" />
          <path d="M18 6 6 18" />
        </svg>
      </button>
    </div>
  }
</div>
