<!--
  Cada aba tem um "slot" fixo com o seu iframe. Os slots nunca mudam de
  lugar no DOM (mover um iframe faz o navegador recarregá-lo): a tela
  dividida só muda o layout (grid) e quais slots ficam visíveis.
-->
<div class="iframe-container" [class.iframe-container--split]="split()">

  @if (!tabsService.activeTab()) {
    <div class="empty-state">
      <h2>Workspace WR</h2>
      <p>Selecione uma tela no menu lateral.</p>
    </div>
  }

  @for (tab of tabsService.tabs(); track tab.id) {
    <div class="frame-slot" [class.frame-slot--visible]="isVisible(tab.id)">
      <!--
        name="dtp-workspace": a dtp-angular-library lê o window.name para entrar
        no "modo Workspace" (sem header/menu). Diferente do ?workspace=1 da URL,
        o nome continua valendo mesmo se o sistema redirecionar ao abrir.
      -->
      <iframe
        name="dtp-workspace"
        class="workspace-frame"
        [src]="getSafeUrl(
          tab.id,
          tab.url,
          tabsService.reloadVersion(tab.id)
        )"
        [title]="tab.title"
        (load)="onFrameLoad(tab.id, $event)">
      </iframe>

      <!-- Loading da aba enquanto o iframe carrega a tela. -->
      @if (isVisible(tab.id) && tabsService.isLoading(tab.id)) {
        <div class="frame-loading" role="status" aria-live="polite">
          <span class="frame-loading__spinner" aria-hidden="true"></span>
          <p class="frame-loading__text">Carregando {{ tab.title }}...</p>
        </div>
      }
    </div>
  }

</div>
