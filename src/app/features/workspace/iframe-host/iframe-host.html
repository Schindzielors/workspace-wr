<div class="iframe-container">

  @if (tabsService.tabs().length === 0) {

    <div class="empty-state">
      <h2>Workspace WR</h2>
      <p>Selecione uma tela no menu lateral.</p>
    </div>

  } @else {

    @for (tab of tabsService.tabs(); track tab.id) {

      <iframe
        class="workspace-frame"
        [class.active]="tabsService.activeTabId() === tab.id"
        [src]="getSafeUrl(
          tab.id,
          tab.url,
          tabsService.reloadVersion(tab.id)
        )"
        [title]="tab.title">
      </iframe>

    }

  }

</div>
